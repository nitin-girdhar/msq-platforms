# UAT single-origin routing — the nginx equivalent of infra/Caddyfile.
#
# All six web apps behind ONE host, each under its own path prefix. This is what
# lets the platform install as one PWA with one service-worker scope and one push
# subscription (docs/Architecture.md → Web push & PWA). Six per-port origins would
# mean six SW scopes and six subscriptions.
#
#   /                -> auth-web      :3000   (login, select-branch — AND the PWA
#                                              manifest, /sw.js and icons, which
#                                              MUST be served from the origin root)
#   /lms   /lms/*    -> lms-web       :3001
#   /hrms  /hrms/*   -> hr-web        :3002
#   /todo  /todo/*   -> todo-web      :3003
#   /admin /admin/*  -> admin-web     :3004
#   /sa    /sa/*     -> lookup-admin  :3005
#
# DO NOT STRIP THE PREFIX. Each product app is compiled with a matching Next
# `basePath`, so it EXPECTS to receive its own prefix and generates its assets and
# links under it. That is why every proxy_pass below has NO URI part (no trailing
# path, not even "/") — nginx then passes the original URI through untouched.
# Adding a trailing slash (proxy_pass http://lms_web/;) strips the prefix and
# every route 404s.
#
# The regex form `^/lms(/|$)` matches the bare prefix AND the subtree, but not
# /lmsfoo. The bare form matters: it is what a person types by hand.
#
# The api-gateway (:4000) is deliberately NOT exposed here. Browsers call
# same-origin /api/*, which each Next app rewrites server-side to
# API_GATEWAY_INTERNAL_URL over the docker network.

upstream auth_web     { server 127.0.0.1:3000; keepalive 16; }
upstream lms_web      { server 127.0.0.1:3001; keepalive 16; }
upstream hr_web       { server 127.0.0.1:3002; keepalive 16; }
upstream todo_web     { server 127.0.0.1:3003; keepalive 16; }
upstream admin_web    { server 127.0.0.1:3004; keepalive 16; }
upstream lookup_admin { server 127.0.0.1:3005; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name apps-uat.fitclass.in;

    # certbot --nginx rewrites this to a 301 once the cert is issued; until then
    # it must serve the ACME challenge over plain http.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apps-uat.fitclass.in;

    # Filled in by: certbot --nginx -d apps-uat.fitclass.in
    ssl_certificate     /etc/letsencrypt/live/apps-uat.fitclass.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps-uat.fitclass.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Shared proxy behaviour. X-Forwarded-Proto is what tells Next it is on HTTPS;
    # without it, redirects and absolute URLs come back as http:// and the browser
    # leaves the secure context — which silently kills the service worker.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Employee photo upload is capped at PHOTO_MAX_BYTES (2 MB) in the app; this
    # only needs to be comfortably above it, or nginx rejects with 413 before the
    # app can return its own error.
    client_max_body_size 10m;

    # Server-Sent Events: the realtime notification stream
    # (GET /api/notifications/stream) is a connection that stays open for as long
    # as the tab does. nginx's 60s default read timeout would tear it down every
    # minute and the client would reconnect in a loop. The service already sends
    # `X-Accel-Buffering: no`, which nginx honours per-response, so the stream is
    # not buffered even though buffering stays on for everything else.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/lms(/|$)   { proxy_pass http://lms_web; }
    location ~ ^/hrms(/|$)  { proxy_pass http://hr_web; }
    location ~ ^/todo(/|$)  { proxy_pass http://todo_web; }
    location ~ ^/admin(/|$) { proxy_pass http://admin_web; }
    location ~ ^/sa(/|$)    { proxy_pass http://lookup_admin; }

    # auth-web owns everything else, including the root — and therefore the PWA
    # manifest, /sw.js and the icons. Must stay LAST.
    location / { proxy_pass http://auth_web; }
}
