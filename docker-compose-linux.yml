name: msq

# ── Shared environment blocks (YAML anchors) ─────────────────────────────────
# All variables are read from .env — change DB_NAME, passwords, ports, etc. there.
x-db-env: &db-env
  DATABASE_URL: postgres://${DB_LEAD_SVC_USER}:${DB_LEAD_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_TENANT: postgres://${DB_TENANT_SVC_USER}:${DB_TENANT_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_SERVICE: postgres://${DB_SERVICE_USER}:${DB_SERVICE_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}

# Image names must match what `docker compose build` tags from
# docker-compose.yml: those services use `build:` with no `image:` key, so
# compose names them <project>-<service> and the project (top of this file) is
# `msq`. msq-deploy/build-deploy.ps1 exports exactly this set.
#
# Cross-repo networking (NOT solved here — see docker-compose.yml's note):
# api-gateway's product-service URLs are env-driven so this stays valid once
# the parent workspace wires an external Docker network across repos.

services:
  postgres:
    image: postgres:18.4
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Long syntax on purpose: build-deploy.ps1 merges with
      # `docker compose config --no-interpolate`, so the short form's source
      # stays the literal `${DB_DATA_PATH}` -- which compose then classifies as
      # a *named volume* (it doesn't start with ./ or /), producing a merged
      # file that fails with "refers to undefined volume". Declaring the type
      # explicitly keeps it a bind mount through the merge.
      - type: bind
        source: ${DB_DATA_PATH}
        target: /var/lib/postgresql
        bind:
          create_host_path: true
      # Schema bootstrap: the ordered 00-10 set in the platform-root db_scripts/,
      # the same sequence db_scripts/db_deploy.ps1 runs. Mounted file-by-file
      # (rather than mounting the whole directory) so ONLY the schema runs at
      # first-boot -- reference_data/ and dummy_data/ are driven afterwards by
      # bootstrap-db.sh, because dummy_data must stay opt-in.
      - ./db_scripts/00_extensions_schemas_roles.sql:/docker-entrypoint-initdb.d/00-extensions-schemas-roles.sql
      - ./db_scripts/01_functions_shared.sql:/docker-entrypoint-initdb.d/01-functions-shared.sql
      - ./db_scripts/02_tables_core.sql:/docker-entrypoint-initdb.d/02-tables-core.sql
      - ./db_scripts/03_tables_product.sql:/docker-entrypoint-initdb.d/03-tables-product.sql
      - ./db_scripts/04_functions_triggers.sql:/docker-entrypoint-initdb.d/04-functions-triggers.sql
      - ./db_scripts/05_views.sql:/docker-entrypoint-initdb.d/05-views.sql
      - ./db_scripts/06_indexes.sql:/docker-entrypoint-initdb.d/06-indexes.sql
      - ./db_scripts/07_grants.sql:/docker-entrypoint-initdb.d/07-grants.sql
      - ./db_scripts/08_rls.sql:/docker-entrypoint-initdb.d/08-rls.sql
      - ./db_scripts/09_schema_version.sql:/docker-entrypoint-initdb.d/09-schema-version.sql
      - ./db_scripts/10_tenant_provisioning.sql:/docker-entrypoint-initdb.d/10-tenant-provisioning.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    image: msq-identity-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${IDENTITY_SERVICE_PORT}
      <<: *db-env
      # Profile-photo (avatar) storage. MUST resolve to the SAME shared blob
      # volume hr-service mounts (msq-hrms/docker-compose-linux.yml) so the
      # avatar identity writes is the exact file hr-service enrolls with CompreFace.
      BLOB_STORAGE_DRIVER: ${BLOB_STORAGE_DRIVER:-local}
      BLOB_STORAGE_DIR: ${BLOB_STORAGE_DIR:-/data/blobs}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-2097152}
    # Internal-only: reachable over the compose network, not published to host.
    expose:
      - "${IDENTITY_SERVICE_PORT}"
    volumes:
      # Long syntax (see hr-service note): same host dir + container path so the
      # two services share one blob store.
      - type: bind
        source: ${BLOB_HOST_PATH:-./data/blobs}
        target: ${BLOB_STORAGE_DIR:-/data/blobs}
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy

  communication-service:
    image: msq-communication-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${COMMUNICATION_SERVICE_PORT}
    expose:
      - "${COMMUNICATION_SERVICE_PORT}"

  admin-service:
    image: msq-admin-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${ADMIN_SERVICE_PORT}
      <<: *db-env
    expose:
      - "${ADMIN_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: msq-api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${GATEWAY_PORT}
      <<: *db-env
      IDENTITY_SERVICE_URL: http://identity-service:${IDENTITY_SERVICE_PORT}
      COMMUNICATION_SERVICE_URL: http://communication-service:${COMMUNICATION_SERVICE_PORT}
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT}
      # Product service URLs — resolved against the shared Docker network once
      # the parent workspace wires it. Point these at msq-lms/msq-hrms/
      # msq-todo's containers in your .env.
      LEADS_SERVICE_URL: ${LEADS_SERVICE_URL}
      META_SERVICE_URL: ${META_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL}
      HR_SERVICE_URL: ${HR_SERVICE_URL}
      TASKS_SERVICE_URL: ${TASKS_SERVICE_URL}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      communication-service:
        condition: service_started
      admin-service:
        condition: service_started

  # P4.3: one image per product, shared SSO cookie. See docker-compose.yml for
  # the topology notes. These consume prebuilt images shipped to the server.
  #
  # NEXT_PUBLIC_* values are baked in at build time on the Windows build host,
  # so setting them here does nothing for browser-facing URLs — if the server's
  # public hostname differs from the build-time default, rebuild the web images
  # with the right build args rather than editing this file.
  auth-web:
    image: msq-auth-web
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  lookup-admin:
    image: msq-lookup-admin
    restart: unless-stopped
    env_file: .env
    environment:
      # Same port inside and out — see docker-compose.yml for why 3001 was wrong.
      PORT: "3005"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${GATEWAY_PORT}}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3005:3005"
    depends_on:
      - api-gateway
