name: msq

# ── Shared environment blocks (YAML anchors) ─────────────────────────────────
# All variables are read from .env — change DB_NAME, passwords, ports, etc. there.
x-db-env: &db-env
  DATABASE_URL: postgres://${DB_LEAD_SVC_USER}:${DB_LEAD_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_TENANT: postgres://${DB_TENANT_SVC_USER}:${DB_TENANT_SVC_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}
  DATABASE_URL_SERVICE: postgres://${DB_SERVICE_USER}:${DB_SERVICE_PASSWORD}@${DB_CONTAINER_NAME}:5432/${DB_NAME}

# Browser-facing build args for the shared web images (auth-web, admin-web,
# lookup-admin). Defaults are the single-origin dev topology: one host, one path
# prefix per app, matching each app's compiled `basePath` and infra/Caddyfile.
# These are a legacy build-time fallback only — the unprefixed AUTH_URL/LMS_URL/
# ... in .env are what sso.ts actually reads at runtime.
x-web-public-args: &web-public-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${GATEWAY_PORT}}
  API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
  NEXT_PUBLIC_PASSWORD_MIN_LENGTH: ${NEXT_PUBLIC_PASSWORD_MIN_LENGTH:-12}
  NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://app.localhost}
  NEXT_PUBLIC_LMS_URL: ${NEXT_PUBLIC_LMS_URL:-http://app.localhost/lms}
  NEXT_PUBLIC_HR_URL: ${NEXT_PUBLIC_HR_URL:-http://app.localhost/hrms}
  NEXT_PUBLIC_TASK_URL: ${NEXT_PUBLIC_TASK_URL:-http://app.localhost/todo}
  # lookup-admin -> /sa, admin-web -> /admin. Not interchangeable.
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://app.localhost/sa}
  NEXT_PUBLIC_ADMIN_WEB_URL: ${NEXT_PUBLIC_ADMIN_WEB_URL:-http://app.localhost/admin}

# ── Cross-repo networking (SOLVED — via `include:`, not an external net) ────
# api-gateway proxies to product services (leads-service, hr-service,
# tasks-service, notifications-service, meta-conversion-api) that live in
# msq-lms/msq-hrms/msq-todo, not this repo, and Caddy proxies to their web apps.
#
# All four repos' compose files declare the SAME project name (`name: msq`), so
# the `include:` block below pulls the other three in and every service lands in
# one project on one default network (msq_default), reachable by container name.
# `docker compose up` from this directory therefore starts the whole platform,
# and the *_SERVICE_URL values below are hardcoded to those container names.
#
# `include:`, NOT COMPOSE_FILE. COMPOSE_FILE resolves every merged file's
# relative paths against the PROJECT directory, so each product repo's
# `context: ..` climbed one level ABOVE the platform root and the build died on
# "GetFileAttributesEx ...\msq-lms: The system cannot find the file specified".
# `include:` resolves each file's paths against that file's own directory, which
# is what these compose files were written for and what keeps them runnable
# standalone.
#
# This replaces the previously-planned `docker network create platform-net` +
# `external: true` approach: an external network needs creating out-of-band
# before anything works and leaves four separate projects whose `up`/`down`
# lifecycles drift apart. Merging needs no setup step and keeps one lifecycle.
# Running a product repo standalone still works from its own directory with its
# own .env — that path is unchanged.

# `env_file: .env` on each entry is REQUIRED, not decorative. By default an
# included file is interpolated with the .env sitting next to IT
# (msq-lms/.env, …), which holds that repo's STANDALONE values — a
# `localhost` database host and the pre-single-origin `localhost:3000/3001`
# app URLs. Those silently won a merged run: the product apps redirected to a
# dead origin and leads-service dialled ::1:5432. Pointing every include at
# the platform root's .env makes one file the single source of truth.
include:
  - path: msq-lms/docker-compose.yml
    env_file: .env
  - path: msq-hrms/docker-compose.yml
    env_file: .env
  - path: msq-todo/docker-compose.yml
    env_file: .env

services:
  postgres:
    image: postgres:18.4
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql
      # Schema bootstrap: the ordered 00-10 set in the platform-root db_scripts/,
      # the same sequence db_scripts/db_deploy.ps1 runs. Mounted file-by-file
      # (rather than mounting the whole directory) so ONLY the schema runs at
      # first-boot -- reference_data/ and dummy_data/ stay opt-in, driven by
      # db_deploy.ps1 (or bootstrap-db.sh in the deployment bundle).
      - ./db_scripts/00_extensions_schemas_roles.sql:/docker-entrypoint-initdb.d/00-extensions-schemas-roles.sql
      - ./db_scripts/01_functions_shared.sql:/docker-entrypoint-initdb.d/01-functions-shared.sql
      - ./db_scripts/02_tables_core.sql:/docker-entrypoint-initdb.d/02-tables-core.sql
      - ./db_scripts/03_tables_product.sql:/docker-entrypoint-initdb.d/03-tables-product.sql
      - ./db_scripts/04_functions_triggers.sql:/docker-entrypoint-initdb.d/04-functions-triggers.sql
      - ./db_scripts/05_views.sql:/docker-entrypoint-initdb.d/05-views.sql
      - ./db_scripts/06_indexes.sql:/docker-entrypoint-initdb.d/06-indexes.sql
      - ./db_scripts/07_grants.sql:/docker-entrypoint-initdb.d/07-grants.sql
      - ./db_scripts/08_rls.sql:/docker-entrypoint-initdb.d/08-rls.sql
      - ./db_scripts/09_schema_version.sql:/docker-entrypoint-initdb.d/09-schema-version.sql
      - ./db_scripts/10_tenant_provisioning.sql:/docker-entrypoint-initdb.d/10-tenant-provisioning.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: .
      dockerfile: msq-core/services/identity-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${IDENTITY_SERVICE_PORT}
      <<: *db-env
      # Profile-photo (avatar) storage. MUST resolve to the SAME shared blob
      # volume hr-service mounts so the avatar identity writes is the exact
      # file hr-service enrolls with CompreFace.
      # Container path is hardcoded, NOT interpolated: .env holds a *host* path
      # for natively-run services, which would be meaningless inside Linux.
      BLOB_STORAGE_DRIVER: ${BLOB_STORAGE_DRIVER:-local}
      BLOB_STORAGE_DIR: /data/blobs
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-2097152}
    # Internal-only: reachable by other services over the compose network, but
    # NOT published to the host. Only the api-gateway is exposed externally.
    expose:
      - "${IDENTITY_SERVICE_PORT}"
    volumes:
      # BLOB_HOST_PATH is the *host* directory (OS-specific); BLOB_STORAGE_DIR
      # is the path *inside* the container. Long syntax so the host dir is
      # created on first run rather than failing the container.
      - type: bind
        source: ${BLOB_HOST_PATH:-./data/blobs}
        target: /data/blobs
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy

  communication-service:
    build:
      context: .
      dockerfile: msq-core/services/communication-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${COMMUNICATION_SERVICE_PORT}
    expose:
      - "${COMMUNICATION_SERVICE_PORT}"

  admin-service:
    build:
      context: .
      dockerfile: msq-core/services/admin-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${ADMIN_SERVICE_PORT}
      <<: *db-env
    expose:
      - "${ADMIN_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: msq-core/services/api-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${GATEWAY_PORT}
      <<: *db-env
      IDENTITY_SERVICE_URL: http://identity-service:${IDENTITY_SERVICE_PORT}
      COMMUNICATION_SERVICE_URL: http://communication-service:${COMMUNICATION_SERVICE_PORT}
      ADMIN_SERVICE_URL: http://admin-service:${ADMIN_SERVICE_PORT}
      # Product services live in msq-lms/msq-hrms/msq-todo, merged into this
      # same compose project via COMPOSE_FILE in .env, so they resolve by
      # container name on the shared default network — exactly as the core
      # services above do.
      #
      # Hardcoded here rather than read from ${LEADS_SERVICE_URL} and friends:
      # those .env values are `http://localhost:<port>` for local `pnpm turbo
      # dev`, which inside a container means the container itself. Taking them
      # from .env pointed the gateway at its own empty ports and every product
      # API call failed with ECONNREFUSED.
      LEADS_SERVICE_URL: http://leads-service:${LEADS_SERVICE_PORT}
      META_SERVICE_URL: http://meta-conversion-api:${META_SERVICE_PORT}
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:${NOTIFICATIONS_SERVICE_PORT}
      HR_SERVICE_URL: http://hr-service:${HR_SERVICE_PORT}
      TASKS_SERVICE_URL: http://tasks-service:${TASKS_SERVICE_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      communication-service:
        condition: service_started
      admin-service:
        condition: service_started

  auth-web:
    build:
      context: .
      dockerfile: msq-core/apps/auth-web/Dockerfile
      args: *web-public-args
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  lookup-admin:
    build:
      context: .
      dockerfile: msq-core/apps/lookup-admin/Dockerfile
      args: *web-public-args
    restart: unless-stopped
    env_file: .env
    environment:
      # Same port inside and out. Publishing 3005 onto a container listening on
      # 3001 made the container's own origin identical to NEXT_PUBLIC_LMS_URL,
      # so a callback URL derived from the listening port passed auth's
      # allowlist as the LMS and sent admins there after login.
      PORT: "3005"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${GATEWAY_PORT}}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3005:3005"
    depends_on:
      - api-gateway

  admin-web:
    build:
      context: .
      dockerfile: msq-core/apps/admin-web/Dockerfile
      args: *web-public-args
    restart: unless-stopped
    env_file: .env
    environment:
      # Same port inside and out — see lookup-admin's note above for why a
      # mismatch here leaks the container's listening port into the post-login
      # callback URL instead of this app's real origin.
      PORT: "3004"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${GATEWAY_PORT}}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:${GATEWAY_PORT}
    ports:
      - "3004:3004"
    depends_on:
      - api-gateway

  # Reverse proxy for the SINGLE-ORIGIN topology: one host, one path prefix per
  # app (see infra/Caddyfile). This is what makes the platform installable as a
  # single PWA with one service-worker scope and one push subscription.
  #
  # Depends on the product web apps (lms-web/hr-web/todo-web) that live in the
  # product repos — only meaningful when run from the parent workspace with all
  # repos networked together, not standalone from this repo alone. Started
  # without them, `/lms`, `/hrms` and `/todo` return 502 while `/`, `/admin` and
  # `/sa` work.
  caddy:
    image: caddy:2-alpine
    profiles: ["sso-proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 is for the production `apps.fitclass.in` block: Caddy needs it to
      # complete the TLS-ALPN challenge and serve HTTPS. Unused by the local
      # `http://app.localhost` block, which is plain HTTP on purpose.
      - "443:443"
    environment:
      # Selects the site address in infra/Caddyfile. Default is the local
      # `http://app.localhost` (explicit http:// => no ACME attempt). Production
      # sets CADDY_SITE_ADDRESS=apps.fitclass.in in .env so Caddy issues a real
      # certificate. Do NOT point this at a name without a live A record: the
      # failed ACME challenges count against Let's Encrypt's per-host limit.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://app.localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates and ACME account keys — without these the
      # container re-requests a certificate on every recreate and will hit
      # Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-web
      - admin-web
      - lookup-admin

# Named volumes for Caddy's certificate store (sso-proxy profile only). Losing
# /data means re-issuing every certificate, which Let's Encrypt rate-limits.
volumes:
  caddy_data:
  caddy_config:
