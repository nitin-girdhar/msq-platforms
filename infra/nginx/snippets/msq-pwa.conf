# PWA-critical locations, shared by apps-uat.conf and apps-prd.conf.
#
#     include snippets/msq-pwa.conf;
#
# from inside the `server { }` block, AFTER `upstream auth_web` is defined and
# BEFORE the product prefix locations (ordering does not actually matter for
# exact `=` matches, which always win, but reading order should follow priority).
#
# Install alongside the server config:
#     sudo cp msq-pwa.conf /etc/nginx/snippets/
#
# Everything here is served by auth-web, which owns the origin root. That is not
# an arbitrary choice: the manifest's `scope` and `start_url` are both '/', and a
# service worker may only control paths at or below the directory it is served
# from. A worker served from /lms/sw.js could never control /hrms — which is the
# entire reason all six apps share one origin.

# ── /sw.js — the one file that must never be cached ────────────────────────
#
# THE most common way a PWA deploy fails quietly. The browser holds the old
# worker, keeps serving assets from its old caches, and the site looks fine
# while running last release's code. Users cannot fix it by reloading; only
# uninstalling and reinstalling the app clears it.
#
# The spec caps service-worker script caching at 24h and modern browsers default
# `updateViaCache: 'imports'` (the top-level script bypasses the HTTP cache), but
# that is the BROWSER's behaviour — it does nothing about a CDN, a corporate
# proxy, or nginx's own proxy_cache sitting in between. `no-store` is what makes
# the guarantee end to end.
#
# `proxy_hide_header` first: Next serves public/ files with its own
# `Cache-Control: public, max-age=0`, and without hiding it the response would
# carry two conflicting Cache-Control headers.
location = /sw.js {
    proxy_pass http://auth_web;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # Repeated deliberately. `add_header` does NOT merge with the server block's
    # add_header directives — declaring any one of them in a location DROPS
    # every inherited one. Leaving this out silently removes HSTS from /sw.js.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ── /manifest.webmanifest ──────────────────────────────────────────────────
#
# Emitted by auth-web's app/manifest.ts. Next already sets the correct
# `application/manifest+json` content-type; a wrong type makes Chrome ignore the
# manifest entirely and the install prompt never appears.
#
# Short cache rather than no-store: the install prompt and the Home Screen icon
# come from here, so a stale copy survives a rebrand or an icon change, but it is
# re-fetched often enough that it is not the trap /sw.js is.
location = /manifest.webmanifest {
    proxy_pass http://auth_web;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ── /icons/* ───────────────────────────────────────────────────────────────
#
# The manifest icons AND the iOS Home Screen icon
# (<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">). iOS never
# reads the manifest's `icons`, so that one link tag is the only thing standing
# between a proper Home Screen icon and a screenshot of the page.
#
# Origin-absolute for every product path — Next does NOT basePath-prefix
# metadata icon hrefs, so /hrms and /sa link /icons/... too and auth-web serves
# one copy for all six apps.
#
# Content-hashed they are not, so this is a moderate cache, not `immutable`.
location ^~ /icons/ {
    proxy_pass http://auth_web;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ── /offline ───────────────────────────────────────────────────────────────
#
# The service worker precaches this at install time as its navigation fallback
# (`cache.add(new Request('/offline', { cache: 'reload' }))`). `cache: 'reload'`
# bypasses the HTTP cache on the way in, but a cached copy served to the INSTALL
# request would still be a stale shell pinned for the lifetime of that
# SW_VERSION, so keep it uncached at the edge too.
location = /offline {
    proxy_pass http://auth_web;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
