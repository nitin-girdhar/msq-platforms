# Defines $connection_upgrade, used by every server block in this directory.
#
# It is NOT built into nginx. Without it, `nginx -t` fails on the app configs
# with "unknown variable connection_upgrade" and nginx refuses to start at all —
# so this file has to be in place BEFORE apps-*.conf is enabled.
#
# A `map` is only legal in the `http { }` context, which is why it cannot live
# inside apps-uat.conf / apps-prd.conf alongside the server blocks that use it.
# Install it as a conf.d drop-in, which Ubuntu's stock nginx.conf includes from
# inside `http { }`:
#
#     sudo cp connection-upgrade.conf /etc/nginx/conf.d/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Next.js production (`next start`) opens no WebSocket — only `next dev`'s HMR
# does, and the notification stream is Server-Sent Events, which is ordinary
# HTTP. So this is forward-compatibility, not a current requirement: it costs
# nothing and means a future upgrade-based feature is not silently broken by the
# proxy stripping the handshake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
