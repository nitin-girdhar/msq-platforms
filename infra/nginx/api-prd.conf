# Public API host — nginx → api-gateway:4000, nothing else in the path.
# The production counterpart of api-uat.conf; see that file and README.md for
# the full route table and the reasoning.
#
# SEPARATE concern from apps-prd.conf: that file fronts the six Next.js apps
# under one origin for the PWA; this one exposes the gateway to callers that
# have no browser and no Next in front of them (partner integrations, ad-platform
# intake, Meta lead-gen webhooks, the HTML lead report).
#
# None of these carry a session cookie or trigger CORS: machine callers send no
# Origin header, and the report is a top-level navigation, not a fetch. Isolation
# comes from the API key's own tenant/branch binding, which the gateway resolves
# and injects as X-Tenant-Id / X-Org-Id. So this host needs no cookie, CORS,
# basePath or service-worker consideration at all.
#
# Do NOT route these paths through auth-web. Its /api/:path* rewrite would reach
# the gateway too, but it puts a Next server in the path of partner traffic and
# webhook HMAC bodies for no benefit.

upstream api_gateway { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name api.fitclass.in;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.fitclass.in;

    # certbot --nginx -d api.fitclass.in
    ssl_certificate     /etc/letsencrypt/live/api.fitclass.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fitclass.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # No `includeSubDomains` here — this host is a sibling of apps.fitclass.in,
    # not a parent, and partner integrations are server-to-server clients that
    # should not have a browser policy pinned on their behalf.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The gateway's per-IP limiters on /intake/webhook and /meta/webhook read the
    # client IP from here. Without it every caller collapses into one bucket and
    # a single busy partner rate-limits everyone else.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Meta verifies its webhook signature over the RAW body, and the gateway
    # keeps those original bytes. Nothing here may rewrite or re-encode a body —
    # which is also why there is no `gzip` block in this server.
    client_max_body_size 10m;

    location / { proxy_pass http://api_gateway; }
}
