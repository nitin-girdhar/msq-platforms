# Public API host — nginx → api-gateway:4000, nothing else in the path.
#
# This is the UAT equivalent of prod's api.fitclass.in. It is a SEPARATE concern
# from apps-uat.conf: that file fronts the six Next.js apps under one origin for
# the PWA; this one exposes the gateway to callers that have no browser and no
# Next in front of them.
#
#   POST /public/v1/leads                    partner create-lead   (Bearer key)
#   GET  /public/v1/branches|users|locations/* partner reads       (Bearer key)
#   GET  /public/v1/leads/:id                                      (Bearer key)
#   POST /public/v1/communications/send                            (Bearer key)
#   GET  /public/v1/lead-report              HTML page, opened in a browser as
#                                            ?key=<api key> — the gateway's
#                                            extractKey() has a query-param
#                                            fallback precisely for this, since a
#                                            top-level navigation cannot set a
#                                            custom header
#   POST /intake/webhook                     ad-platform intake    (X-Api-Key)
#   GET|POST /meta/webhook[/:integrationId]  Meta lead-gen         (HMAC)
#
# None of these carry a session cookie or trigger CORS: the machine callers send
# no Origin header, and the report is a navigation, not a fetch. Isolation comes
# from the API key's own tenant/branch binding, which the gateway resolves and
# injects as X-Tenant-Id / X-Org-Id. So this host needs no cookie, CORS or
# basePath consideration at all — it is a plain reverse proxy.
#
# Do NOT route these paths through auth-web. Its /api/:path* rewrite would reach
# the gateway too, but it puts a Next server in the path of partner traffic and
# webhook HMAC bodies for no benefit.

upstream api_gateway { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name api-uat.fitclass.in;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-uat.fitclass.in;

    # certbot --nginx -d api-uat.fitclass.in
    ssl_certificate     /etc/letsencrypt/live/api-uat.fitclass.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-uat.fitclass.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The gateway's per-IP limiters on /intake/webhook and /meta/webhook read the
    # client IP from here. Without it every caller collapses into one bucket and
    # a single busy partner rate-limits everyone else.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Meta verifies its webhook signature over the RAW body, and the gateway
    # keeps those original bytes. Nothing here may rewrite or re-encode a body.
    client_max_body_size 10m;

    location / { proxy_pass http://api_gateway; }
}
